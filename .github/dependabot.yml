version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "weekly"
    assignees: ["MrBrunoWolff"]
    labels: ["dependencies"]
    cooldown:
      default-days: 3
    groups:
      compatible-updates:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["MrBrunoWolff"]
    labels: ["dependencies"]
