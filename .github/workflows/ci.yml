name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a release be triggered deliberately — `gh workflow run ci.yml` —
  # instead of pushing an empty commit just to re-run the publish job.
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No audit step, deliberately: this package has zero dependencies, so
      # `bun install` leaves no lockfile and `bun audit` exits 1 with "missing
      # lockfile, nothing to audit". Add one back alongside a first dependency.

      # Black-box tests: the real CLI is driven as a subprocess against a mock
      # OpenAI-compatible server, under both bun and node. Bun is only the test
      # runtime — bench.mjs itself stays dependency-free and Node-compatible.
      - name: Test
        run: bun test

      # bench.mjs is published to npm and entered via `npx`, so plain Node has to
      # keep working. The suite covers this per-case, but this is the blunt guard:
      # if the file stops parsing under Node, it fails here regardless.
      - name: Node compatibility
        run: node --check bench.mjs

      # --format=esm is load-bearing: bench.mjs uses top-level await, which the
      # default CJS output rejects. Compiling one target proves releases can build.
      - name: Compile check
        run: bun run build:binaries bun-linux-x64

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Trusted publishing (OIDC): npm verifies this workflow's identity against
    # the trusted publisher configured on the package, so there is no token to
    # store, leak or rotate — and no 2FA prompt to get stuck behind. `id-token`
    # is what lets the runner mint the OIDC token.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # npm drives the publish, not bun: trusted publishing is an npm CLI
      # feature and `bun publish` has no OIDC support.
      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Publish to npm (if version changed)
        run: |
          # No NODE_AUTH_TOKEN on purpose: with a trusted publisher configured,
          # the CLI exchanges this job's OIDC identity for a short-lived
          # credential itself, and npm attaches a provenance attestation.
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          # Trusted publishing cannot perform a package's *first* publish: npm
          # requires the package to exist before a trusted publisher can be
          # configured on it. Skip until that one-time bootstrap is done, so CI
          # is not red for a reason unrelated to the code.
          if ! npm view "$PACKAGE_NAME" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME does not exist on npm yet."
            echo "Publish once manually, then configure the trusted publisher"
            echo "(repository: this one, workflow: ci.yml)."
            exit 0
          fi

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already exists, skipping publish"
            exit 0
          fi

          echo "Publishing $PACKAGE_NAME@$PACKAGE_VERSION via trusted publishing"

          # A failure here is a real failure. Auth errors used to be tolerated
          # while trusted publishers were still being set up, but that made a
          # green run mean "nothing went wrong" rather than "published" — the
          # wrong signal for a release pipeline. If this fails with E404 or
          # EOTP, the trusted publisher for this package is missing or its
          # fields do not match: organization MrBrunoWolff, this repository,
          # workflow ci.yml, environment empty.
          npm publish
          echo "Published $PACKAGE_NAME@$PACKAGE_VERSION"
